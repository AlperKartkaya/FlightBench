<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 440" role="img" aria-labelledby="title desc">
  <title id="title">How Jev steers FlightBench</title>
  <desc id="desc">Illustrative loop: FlightBench sends flight, runway, controls, motion and phase data. Jev returns four separate Choice answers with probabilities. FlightBench maps labels 2, 7, 4 and 3 to fixed aileron, elevator, rudder and throttle commands. JSBSim uses those commands to compute the next aircraft state.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#000c8b"/>
    </marker>
  </defs>

  <rect width="1080" height="440" rx="22" fill="#f8fafc"/>
  <g font-family="system-ui, sans-serif">
    <text x="36" y="42" font-size="25" font-weight="750" fill="#17243a">How Jev steers FlightBench</text>
    <text x="36" y="66" font-size="13" fill="#5b6980">One state snapshot · four choices · one physics step</text>

    <g fill="#20365d" opacity="0.08">
      <rect x="39" y="100" width="268" height="258" rx="18"/>
      <rect x="350" y="100" width="386" height="258" rx="18"/>
      <rect x="779" y="100" width="268" height="258" rx="18"/>
    </g>
    <g fill="#fff" stroke="#dce4ee">
      <rect x="36" y="96" width="268" height="258" rx="18"/>
      <rect x="347" y="96" width="386" height="258" rx="18"/>
      <rect x="776" y="96" width="268" height="258" rx="18"/>
    </g>

    <g fill="#17243a" font-size="17" font-weight="750">
      <text x="60" y="130">OBSERVE</text>
      <text x="364" y="130">JEV CHOOSES</text>
      <text x="792" y="130">APPLY</text>
    </g>
    <g fill="#5b6980" font-size="12.5">
      <text x="60" y="159">One aircraft-state snapshot</text>
      <text x="364" y="159">Selected labels from four Choice answers</text>
      <text x="792" y="159">Fixed absolute commands</text>
    </g>
    <g stroke="#e5ebf2"><path d="M60 173H290 M364 173H718 M792 173H1020"/></g>

    <g font-size="11" font-weight="700" letter-spacing="0.5" fill="#6a7890">
      <text x="60" y="201">FLIGHT</text><text x="60" y="230">RUNWAY</text>
      <text x="60" y="259">MOTION</text><text x="60" y="288">CONTROLS</text>
      <text x="60" y="319">PHASE</text>
    </g>
    <g font-size="13" font-weight="600" fill="#21344f">
      <text x="146" y="201">30.1 m/s airspeed</text>
      <text x="146" y="230">45 m AGL · +3 m offset</text>
      <text x="146" y="259">+0.6 m/s drift</text>
      <text x="146" y="288">current positions</text>
    </g>
    <rect x="141" y="301" width="95" height="26" rx="13" fill="#e4eafb"/>
    <text x="188.5" y="318" text-anchor="middle" font-size="11" font-weight="750" fill="#000c8b">APPROACH</text>

    <g font-size="13" font-weight="650" fill="#243653">
      <text x="364" y="211">Aileron</text><text x="364" y="250">Elevator</text>
      <text x="364" y="289">Rudder</text><text x="364" y="328">Throttle</text>
    </g>
    <g fill="#e4eafb">
      <rect x="461" y="191" width="43" height="28" rx="14"/>
      <rect x="461" y="230" width="43" height="28" rx="14"/>
      <rect x="461" y="269" width="43" height="28" rx="14"/>
      <rect x="461" y="308" width="43" height="28" rx="14"/>
    </g>
    <g font-size="13" font-weight="750" fill="#000c8b" text-anchor="middle">
      <text x="482.5" y="210">“2”</text><text x="482.5" y="249">“7”</text>
      <text x="482.5" y="288">“4”</text><text x="482.5" y="327">“3”</text>
    </g>
    <g font-size="13" font-weight="600" fill="#21344f">
      <text x="520" y="211">Gentle left roll</text>
      <text x="520" y="250">Normal descent</text>
      <text x="520" y="289">Gentle yaw left</text>
      <text x="520" y="328">Normal approach power</text>
    </g>

    <g stroke="#e9edf3"><path d="M792 221H1020 M792 260H1020 M792 299H1020"/></g>
    <g font-size="13" fill="#53647c">
      <text x="792" y="211">Aileron</text><text x="792" y="250">Elevator</text>
      <text x="792" y="289">Rudder</text><text x="792" y="328">Throttle</text>
    </g>
    <g font-size="17" font-weight="750" fill="#000c8b" text-anchor="end">
      <text x="1020" y="211">−0.20</text><text x="1020" y="250">+0.15</text>
      <text x="1020" y="289">+0.13</text><text x="1020" y="328">0.50</text>
    </g>

    <g fill="none" stroke="#000c8b" stroke-width="2.5" marker-end="url(#arrow)">
      <path d="M309 225H342"/><path d="M738 225H771"/>
    </g>
    <path d="M906 358V398H176V360" fill="none" stroke="#000c8b" stroke-width="2.5" marker-end="url(#arrow)"/>
    <rect x="390" y="375" width="300" height="44" rx="22" fill="#172b4c"/>
    <text x="540" y="402" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">JSBSim computes the next state</text>
  </g>
</svg>
