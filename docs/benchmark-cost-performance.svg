<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-labelledby="title desc">
  <title id="title">Performance on FlightBench</title>
  <desc id="desc">Jev and three Codex models are shown as an airplane, moon, sun and star. The horizontal cost axis is logarithmic; Luna's cost is extrapolated to 120 calls. The vertical landing-score axis is linear from 0% to 60%, with ticks every 10%; a red dashed line marks the 50% successful landing threshold. Sol and Astra icons are shifted slightly below their exact 49% positions for visual clarity; exact values are in the README table. Costs are estimates, not Codex charges.</desc>
  <rect width="800" height="420" rx="18" fill="#f8fafc"/>
  <text x="90" y="28" font-family="system-ui,sans-serif" font-size="20" font-weight="700" fill="#16202b">Performance on FlightBench</text>
  <g font-family="system-ui,sans-serif" font-size="12" fill="#536170" text-anchor="end">
    <text x="78" y="344">0%</text><text x="78" y="294">10%</text><text x="78" y="244">20%</text><text x="78" y="194">30%</text><text x="78" y="144">40%</text><text x="78" y="94">50%</text><text x="78" y="44">60%</text>
  </g>
  <g stroke="#dfe5eb" stroke-width="1">
    <path d="M90 40H680 M90 140H680 M90 190H680 M90 240H680 M90 290H680 M90 340H680"/>
    <path d="M90 40V340 M212.34 40V340 M346.41 40V340 M468.74 40V340 M602.81 40V340 M680 40V340"/>
  </g>
  <path d="M90 90H680" fill="none" stroke="#c6415b" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="98" y="108" font-family="system-ui,sans-serif" font-size="11" font-weight="600" fill="#a7354c">Successful landing threshold</text>
  <path d="M90 40V340H680" fill="none" stroke="#435365" stroke-width="1.5"/>
  <g font-family="system-ui,sans-serif" font-size="12" fill="#536170" text-anchor="middle">
    <text x="90" y="360">$0.01</text><text x="212.34" y="360">$0.03</text><text x="346.41" y="360">$0.10</text><text x="468.74" y="360">$0.30</text><text x="602.81" y="360">$1.00</text><text x="680" y="360">$2.00</text>
    <text x="385" y="393" font-size="14" fill="#23303d">Estimated API cost (USD, log10 scale)</text>
  </g>
  <text transform="translate(24 190) rotate(-90)" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" fill="#23303d">Landing score (0–60%)</text>
  <g font-family="system-ui,sans-serif" font-size="13" font-weight="600">
    <path d="M112.49 46.385l3 10 10 5v4l-10-2-2 7 4 3v2l-5-1-5 1v-2l4-3-2-7-10 2v-4l10-5z" fill="#000c8b" stroke="#fff" stroke-width="1.5" transform="translate(112.49 59.385) scale(1.15) translate(-112.49 -59.385)"/>
    <text x="132" y="65" fill="#000c8b">Jev</text>
    <path d="M142.35 327.92A13 13 0 1 0 142.35 352.08A12.5 12.5 0 0 1 142.35 327.92Z" fill="#c27b1b" transform="rotate(-18 137.55 340)"/>
    <text x="156" y="324" fill="#9f6110">GPT-6 Luna</text>
    <g transform="translate(486.58 116)" fill="#c27b1b" stroke="#fff" stroke-width="1">
      <circle r="8"/><path d="M0-11V-16 M0 11V16 M-11 0H-16 M11 0H16 M-7.78-7.78l-3.53-3.53 M7.78 7.78l3.53 3.53 M7.78-7.78l3.53-3.53 M-7.78 7.78l-3.53 3.53" fill="none" stroke="#c27b1b" stroke-width="2.5" stroke-linecap="round"/>
    </g>
    <text x="506" y="142" fill="#9f6110">GPT-6 Sol</text>
    <path d="M665.63 100l4.5 9.1 10 1.5-7.25 7.1 1.71 10-8.96-4.7-8.96 4.7 1.71-10-7.25-7.1 10-1.5z" fill="#c27b1b" stroke="#fff" stroke-width="1.5"/>
    <text x="646" y="120" text-anchor="end" fill="#9f6110">GPT-6 Astra</text>
  </g>
</svg>
