name: Deploy FlightBench simulator to GitHub Pages

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag whose recordings should be published"
        required: true
        default: "v0.1.0"
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preserve recording URLs
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p site/media
          mkdir -p site/jev-flight site/human-flight site/baseline-flight

          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir site/media \
            --pattern "FlightBench-Jev.mp4" \
            --pattern "FlightBench-HumanPilot.mp4" \
            --pattern "FlightBench-Baseline.mp4"

          cat > site/styles.css <<'CSS'
          :root {
            color-scheme: dark;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #171a1f;
            color: #eef3ef;
          }

          * { box-sizing: border-box; }

          body {
            margin: 0;
            min-height: 100vh;
            background:
              radial-gradient(circle at top, rgba(105, 151, 127, 0.15), transparent 42rem),
              #171a1f;
          }

          main {
            width: min(1120px, calc(100% - 32px));
            margin: 0 auto;
            padding: 48px 0 64px;
          }

          a { color: #9bd5b5; }

          .eyebrow {
            text-transform: uppercase;
            letter-spacing: .14em;
            font-size: 12px;
            color: #91aa9c;
          }

          h1 {
            margin: 8px 0 10px;
            font-size: clamp(32px, 6vw, 58px);
            line-height: 1;
          }

          p {
            color: #b8c4bd;
            line-height: 1.6;
          }

          .player {
            margin-top: 28px;
            border: 1px solid #34423a;
            border-radius: 16px;
            overflow: hidden;
            background: #0f1215;
            box-shadow: 0 24px 70px rgba(0, 0, 0, .28);
          }

          video {
            display: block;
            width: 100%;
            max-height: 78vh;
            background: #000;
          }

          nav {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 20px;
          }

          nav a, .card {
            border: 1px solid #34423a;
            border-radius: 12px;
            padding: 12px 16px;
            text-decoration: none;
            background: rgba(255,255,255,.025);
          }

          .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 14px;
            margin-top: 28px;
          }

          .card strong {
            display: block;
            margin-bottom: 6px;
            color: #eef3ef;
          }

          .card span {
            color: #9fb0a6;
          }

          footer {
            margin-top: 32px;
            color: #7f9187;
            font-size: 14px;
          }
          CSS

          cat > site/index.html <<EOF
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1">
            <meta name="color-scheme" content="dark">
            <title>FlightBench Recordings</title>
            <link rel="stylesheet" href="./styles.css">
          </head>
          <body>
            <main>
              <div class="eyebrow">FlightBench · ${RELEASE_TAG}</div>
              <h1>Flight recordings</h1>
              <p>Full-quality recordings published from the <code>${RELEASE_TAG}</code> GitHub Release.</p>

              <div class="grid">
                <a class="card" href="./jev-flight/">
                  <strong>Jev</strong>
                  <span>TypeSafe System One landing run</span>
                </a>
                <a class="card" href="./human-flight/">
                  <strong>Human Pilot</strong>
                  <span>Personal-best reference run</span>
                </a>
                <a class="card" href="./baseline-flight/">
                  <strong>Baseline Controller</strong>
                  <span>Rule-based reference controller</span>
                </a>
              </div>

              <footer>
                <a href="https://github.com/${GITHUB_REPOSITORY}">Back to FlightBench on GitHub</a>
              </footer>
            </main>
          </body>
          </html>
          EOF

          make_player() {
            slug="$1"
            title="$2"
            subtitle="$3"
            media="$4"

            cat > "site/${slug}/index.html" <<EOF
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1">
            <meta name="color-scheme" content="dark">
            <title>${title} · FlightBench</title>
            <link rel="stylesheet" href="../styles.css">
          </head>
          <body>
            <main>
              <div class="eyebrow">FlightBench · ${RELEASE_TAG}</div>
              <h1>${title}</h1>
              <p>${subtitle}</p>

              <div class="player">
                <video controls autoplay muted loop playsinline preload="metadata">
                  <source src="../media/${media}" type="video/mp4">
                  Your browser does not support HTML video.
                </video>
              </div>

              <nav>
                <a href="../recordings/">All recordings</a>
                <a href="../">Fly the simulator</a>
                <a href="https://github.com/${GITHUB_REPOSITORY}">GitHub repository</a>
                <a href="https://github.com/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG}">Release ${RELEASE_TAG}</a>
              </nav>
            </main>
          </body>
          </html>
          EOF
          }

          make_player \
            "jev-flight" \
            "Jev lands the plane" \
            "A full FlightBench landing run controlled by TypeSafe Jev." \
            "FlightBench-Jev.mp4"

          make_player \
            "human-flight" \
            "Human Pilot landing" \
            "The human-pilot reference run used in the FlightBench README." \
            "FlightBench-HumanPilot.mp4"

          make_player \
            "baseline-flight" \
            "Baseline Controller landing" \
            "The rule-based baseline controller reference run." \
            "FlightBench-Baseline.mp4"

          mkdir -p site/recordings
          sed 's|href="./|href="../|g' site/index.html > site/recordings/index.html
          touch site/.nojekyll

          echo "Pages artifact contents:"
          find site -maxdepth 3 -type f -print

      - name: Set up Python for browser simulator
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv for browser simulator
        uses: astral-sh/setup-uv@v6

      - name: Build JSBSim WASM (no AI credentials)
        shell: bash
        run: |
          set -euo pipefail
          uv sync --frozen
          uv run --frozen python examples/prepare_wasm.py
          mkdir -p scratch/emsdk
          git -C scratch/emsdk init
          git -C scratch/emsdk remote add origin https://github.com/emscripten-core/emsdk.git
          git -C scratch/emsdk fetch --depth 1 origin d7b4130688bfa348392b921ab04015aa15c4f154
          git -C scratch/emsdk checkout FETCH_HEAD
          scratch/emsdk/emsdk install 4.0.18
          scratch/emsdk/emsdk activate 4.0.18
          source scratch/emsdk/emsdk_env.sh
          bash examples/wasm/build.sh

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build the existing 3D UI for /FlightBench/
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix frontend ci
          npm --prefix frontend test
          node --test frontend/public/wasm/*.test.js workers/jev-proxy/worker.test.js
          npm --prefix frontend run build:pages
          cp -R frontend/dist-pages/. site/
          rm -f site/wasm/*.test.js

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
