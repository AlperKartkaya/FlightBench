name: Validate leaderboard submissions

on:
  pull_request:
    paths:
      - "leaderboard/submissions/**"
      - "leaderboard/campaigns/**"
      - "leaderboard/schema/**"
      - "leaderboard/verified.json"
      - "flightbench/**"
      - "tests/**"
      - "examples/controllers/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/validate-leaderboard.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci --ignore-scripts
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --extra dev
      - name: Offline regression checks (no provider credentials)
        run: |
          uv run --frozen ruff check flightbench tests
          uv run --frozen ruff format --check flightbench tests
          uv run --frozen pytest -q
      - name: Validate data only (never execute submitted controllers)
        run: |
          uv run python - <<'PY'
          import json
          import os
          from pathlib import Path
          from flightbench.leaderboard import Submission, validate_submission
          for path in Path("leaderboard").rglob("submission.json"):
              validate_submission(json.loads(path.read_text()), path.parent)
          (Path(os.environ["RUNNER_TEMP"]) / "submission-v1.schema.json").write_text(
              json.dumps(Submission.model_json_schema(), indent=2) + "\n"
          )
          PY
          diff -u leaderboard/schema/submission-v1.schema.json "$RUNNER_TEMP/submission-v1.schema.json"
          # A pull request cannot grant itself verified publication status.
          base="${{ github.event.pull_request.base.sha }}"
          if git cat-file -e "$base:leaderboard/verified.json" 2>/dev/null; then
            git show "$base:leaderboard/verified.json" > "$RUNNER_TEMP/verified.json"
          else
            printf '{}\n' > "$RUNNER_TEMP/verified.json"
          fi
          uv run python -m flightbench.leaderboard build --output-dir "$RUNNER_TEMP/leaderboard" \
            --verified-registry "$RUNNER_TEMP/verified.json"
